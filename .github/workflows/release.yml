name: Issue new release

on:
  push:
    tags:
      - 'v*'
    branches:
      - "!*"

jobs:
  release:
    runs-on: ubuntu-24.04
    name: Release
    steps:
      - name: Set up go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: stable

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Run GoReleaser
        if: success()
        run: |
          make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
