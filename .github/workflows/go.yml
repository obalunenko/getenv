name: Go [lint, test]

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'scripts/**'
      - 'tools/**'
      - '**/*.go'
      - '**/*.gohtml'
      - '**/*.proto'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '!**.*md'
      - '.github/workflows/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - '*'
    paths:
      - 'scripts/**'
      - 'tools/**'
      - '**/*.go'
      - '**/*.gohtml'
      - '**/*.proto'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '!**.*md'
      - '.github/workflows/**'

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ 'ubuntu-24.04' ]
        go-version: [1.27.4]
    runs-on: ${{ matrix.os }}
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: |
          go version
        shell: bash

      - name: Set up cache
        uses: actions/cache@v6
        env:
          cache-name: cache-tools-${{ github.job }}-${{ secrets.CACHE_VERSION }}
        with:
          path: |
            ${{ env.GOBIN }}
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('go.sum', 'tools/*/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Check release
        run: |
          make check-releaser
        shell: bash

  testing:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ 'ubuntu-24.04' ]
        go-version: [1.27.4]
    runs-on: ${{ matrix.os }}
    name: Run Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: |
          go version
        shell: bash

      - name: Set up cache
        uses: actions/cache@v6
        env:
          cache-name: cache-tools-${{ github.job }}-${{ secrets.CACHE_VERSION }}
        with:
          path: |
            ${{ env.GOBIN }}
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('go.sum', 'tools/*/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Test
        run: |
          make test
        shell: bash

  # The go directive in go.mod is the minimum Go version for library users; make sure it holds.
  testing-min-go:
    runs-on: ubuntu-24.04
    name: Run Tests (minimum Go from go.mod)
    env:
      # Fail instead of switching to a newer toolchain.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: |
          go version
        shell: bash

      # make test builds gotestsum from tools/, which needs the development Go version.
      - name: Test
        run: |
          go test -race ./...
        shell: bash

  linting:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ 'ubuntu-24.04' ]
        go-version: [1.27.4]
    runs-on: ${{ matrix.os }}
    name: Run linters
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: |
          go version
        shell: bash

      - name: Vet
        run: |
          make vet
        shell: bash

      # Dependabot bumps golangci-lint in tools/golangci-lint/go.mod; CI follows it.
      - name: Get golangci-lint version
        id: golangci-lint
        run: |
          echo "version=$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/golangci-lint/go.mod)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          args: --config .golangci.pipe.yml

  reports:
    needs: [ testing, testing-min-go, linting, build ]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os: [ 'ubuntu-24.04' ]
        go-version: [1.27.4]
    runs-on: ${{ matrix.os }}
    name: Quality reports
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: |
          go version
        shell: bash

      - name: Set up cache
        uses: actions/cache@v6
        env:
          cache-name: cache-tools-${{ github.job }}-${{ secrets.CACHE_VERSION }}
        with:
          path: |
            ${{ env.GOBIN }}
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('go.sum', 'tools/*/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Prepare test coverage and reports
        run: |
          make prepare-cover-report
        shell: bash

      - name: Get golangci-lint version
        id: golangci-lint
        run: |
          echo "version=$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/golangci-lint/go.mod)" >> "$GITHUB_OUTPUT"
        shell: bash

      # .golangci.yml writes the checkstyle report for Sonar to linters-report.xml.
      - name: Prepare lint report
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          args: --config .golangci.yml

      # Codecov rejects tokenless uploads to the default branch; authenticate with OIDC.
      - name: Cover report upload
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/full.cov
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: SonarCloud report upload
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

