name: Go [lint, test]

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'scripts/**'
      - 'tools/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '!**.*md'
      - '.github/workflows/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'scripts/**'
      - 'tools/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '!**.*md'
      - '.github/workflows/**'

# Go versions come from the setup-go aliases: stable is the latest release, oldstable the previous one.
jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - run: |
          go version
        shell: bash

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Check release
        run: |
          make check-releaser
        shell: bash

  testing:
    strategy:
      fail-fast: false
      matrix:
        # Both supported Go releases; the go directive in go.mod must not be newer than oldstable.
        go-version: [ stable, oldstable ]
    runs-on: ubuntu-24.04
    name: Run Tests (Go ${{ matrix.go-version }})
    env:
      # Fail instead of switching to a newer toolchain than the one under test.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: |
          go version
        shell: bash

      - name: Test
        run: |
          make test
        shell: bash

  linting:
    runs-on: ubuntu-24.04
    name: Run linters
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - run: |
          go version
        shell: bash

      - name: Vet
        run: |
          make vet
        shell: bash

      # Dependabot bumps golangci-lint in tools/golangci-lint/go.mod; CI follows it.
      - name: Get golangci-lint version
        id: golangci-lint
        run: |
          echo "version=$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/golangci-lint/go.mod)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          args: --config .golangci.yml

  reports:
    needs: [ testing, linting, build ]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    name: Quality reports
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - run: |
          go version
        shell: bash

      # Also writes tests-report.json for Sonar.
      - name: Test coverage
        run: |
          make test-cover
        shell: bash

      - name: Get golangci-lint version
        id: golangci-lint
        run: |
          echo "version=$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/golangci-lint/go.mod)" >> "$GITHUB_OUTPUT"
        shell: bash

      # The checkstyle report is for Sonar only, so the flag is here and not in .golangci.yml.
      - name: Prepare lint report
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          args: --config .golangci.yml --output.checkstyle.path=linters-report.xml

      # Codecov rejects tokenless uploads to the default branch; authenticate with OIDC.
      - name: Cover report upload
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/full.cov
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: SonarCloud report upload
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
